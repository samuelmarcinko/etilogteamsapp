# ============================================
# ETILOG Teams Approval App - Infomaniak VPS Deployment
# ============================================
# Compatible with Traefik v3 reverse proxy
#
# Deploy location: /srv/stacks/apps/teams-app/
# Usage: docker compose -f docker-compose.infomaniak.yml up -d

# Bez `version:`. Compose v2 ten údaj ignoruje a pri každom nasadení naň
# upozorňuje; nechať ho tam znamená len dva riadky varovania medzi výstupom,
# ktorý má človek pri nasadzovaní naozaj čítať.

services:
  # ==========================================
  # Teams Approval App (Node.js)
  # ==========================================
  teams-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: etilog/teams-approval-app:latest
    container_name: teams-app
    restart: unless-stopped
    # Strop pamäte a poradie pri jej nedostatku.
    #
    # Toto tu je preto, že 17. septembra WordPress na tom istom stroji vypustil
    # 162 procesov Apache a zjedol desať gigabajtov. Portál si vtedy bral 134 MB
    # a aj tak spadol - štyri a pol hodiny bol nedostupný sklad, HR aj výrobný
    # plán kvôli webu, s ktorým nemajú nič spoločné. Kontajnery nemali žiadne
    # stropy, takže medzi nimi neboli žiadne steny.
    #
    # `mem_limit` je strop pre nás: keby niekedy tiekla pamäť tu, zastaví sa to
    # na tomto čísle a nezoberie to so sebou celý server. Je zámerne veľkorysý -
    # v prevádzke berie appka okolo 140 MB, takže sa jej nikdy nemá dotknúť.
    #
    # `oom_score_adj` je poradie: keď sa pamäť minie, jadro si vyberá obeť podľa
    # spotreby a tento portál je z celého stroja ten najmenej hladný a zároveň
    # ten najdôležitejší. Záporné číslo znamená „na tohto siahni ako na
    # posledného". Databáza má ešte nižšie - jej strata zhodí aj appku.
    mem_limit: 1536m
    oom_score_adj: -500
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DB_HOST=teams-app-db
      - DB_PORT=5432
      - UPLOAD_DIR=/app/uploads
      - BACKUP_DIR=/app/backups
    volumes:
      # Host mount for persistent file storage - accessible directly on VPS
      - /srv/stacks/apps/teams-app/uploads:/app/uploads
      - /srv/stacks/apps/teams-app/backups:/app/backups
      # Prázdny priečinok z dátového disku, pripojený len na meranie voľného
      # miesta: `statfs` vráti údaje o celom zväzku, takže sa disk s Dockerom
      # a databázou dá sledovať bez toho, aby appka videla čokoľvek z jeho
      # obsahu. Bez tejto prípojky sa meria len koreňový disk.
      - /mnt/data/.health:/host-data:ro
    # Logy kontajnera nemajú v predvolenom nastavení žiadny strop - Docker ich
    # píše, kým je na disku miesto. Za mesiace prevádzky to bývajú gigabajty a
    # nikto ich nemaže. Tri súbory po 20 MB je dosť na to, aby sa dalo pozrieť
    # spätne, čo sa dialo, a málo na to, aby to niekedy zaplnilo disk.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    depends_on:
      teams-app-db:
        condition: service_healthy
    networks:
      - proxy
      - teams-app-internal
    labels:
      # ========== Traefik v3 Configuration ==========
      - "traefik.enable=true"

      # HTTP Router (redirect to HTTPS)
      - "traefik.http.routers.teams-app-http.rule=Host(`portal.etilog.com`)"
      - "traefik.http.routers.teams-app-http.entrypoints=web"
      - "traefik.http.routers.teams-app-http.middlewares=https-redirect@docker"

      # HTTPS Router
      - "traefik.http.routers.teams-app.rule=Host(`portal.etilog.com`)"
      - "traefik.http.routers.teams-app.entrypoints=websecure"
      - "traefik.http.routers.teams-app.tls=true"
      - "traefik.http.routers.teams-app.tls.certresolver=le"

      # Service configuration
      - "traefik.http.services.teams-app.loadbalancer.server.port=3978"

      # Network configuration
      - "traefik.docker.network=proxy"

      # HTTPS redirect middleware
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"

  # ==========================================
  # PostgreSQL Database
  # ==========================================
  teams-app-db:
    image: postgres:15-alpine
    container_name: teams-app-db
    restart: unless-stopped
    # Pozri poznámku pri `teams-app`. Databáza má ešte nižšie číslo než appka:
    # 17. septembra sa OOM trafil presne do databázy druhého stacku a zhodil s
    # ňou všetko, čo na nej viselo. Toto je posledná vec na stroji, ktorej sa
    # má jadro dotknúť. V prevádzke berie okolo 50 MB.
    mem_limit: 1024m
    oom_score_adj: -700
    environment:
      POSTGRES_DB: ${DB_NAME:-teams_approval}
      POSTGRES_USER: ${DB_USER:-approval_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - teams-app-db-data:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - teams-app-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-approval_user} -d ${DB_NAME:-teams_approval}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - "traefik.enable=false"

# ==========================================
# Volumes
# ==========================================
volumes:
  teams-app-db-data:
    name: teams-app-db-data
  # Note: uploads are stored directly on host at /srv/stacks/apps/teams-app/uploads

# ==========================================
# Networks
# ==========================================
networks:
  # External proxy network for Traefik
  proxy:
    external: true

  # Internal network for app <-> database communication
  teams-app-internal:
    name: teams-app-internal
    driver: bridge
