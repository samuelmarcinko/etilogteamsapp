<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETILOG Approval System</title>
    <link rel="stylesheet" href="/assets/css/style.css?v=20260317c">
    <script src="https://res.cdn.office.net/teams-js/2.19.0/js/MicrosoftTeams.min.js"></script>
    <script src="/assets/js/i18n.js?v=20260317c"></script>
    <script src="/assets/js/navigation.js?v=20260317c"></script>
</head>
<body data-page="create">
    <div class="container">
        <!-- Navigation -->
        <div id="navContainer"></div>

        <!-- Header -->
        <div class="header">
            <img src="/assets/images/logo.png" alt="ETILOG Logo" class="logo">
            <div class="header-content">
                <h1 data-i18n="pageTitle">Approval Request System</h1>
                <p data-i18n="pageSubtitle">Create a new approval request</p>
            </div>
        </div>

        <!-- Success/Error Messages -->
        <div id="alertContainer"></div>

        <!-- Main Form Card -->
        <div class="card">
            <form id="approvalForm">
                <!-- Request Title -->
                <div class="form-group">
                    <label class="form-label" for="title">
                        <span data-i18n="labelTitle">Request Title</span>
                        <span class="required" data-i18n="required">*</span>
                    </label>
                    <input 
                        type="text" 
                        id="title" 
                        name="title" 
                        class="form-input" 
                        data-i18n-placeholder="placeholderTitle"
                        required
                    >
                </div>

                <!-- Description -->
                <div class="form-group">
                    <label class="form-label" for="description">
                        <span data-i18n="labelDescription">Description</span>
                        <span class="required" data-i18n="required">*</span>
                    </label>
                    <textarea 
                        id="description" 
                        name="description" 
                        class="form-textarea" 
                        data-i18n-placeholder="placeholderDescription"
                        required
                    ></textarea>
                    <p class="helper-text" data-i18n="helperDescription">Provide all relevant information</p>
                </div>

                <!-- Type and Priority (2 columns) -->
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="ticketType">
                            <span data-i18n="labelType">Request Type</span>
                            <span class="required" data-i18n="required">*</span>
                        </label>
                        <select id="ticketType" name="ticketType" class="form-select" required onchange="toggleDateFields()">
                            <option value="" data-i18n="placeholderType">-- Select type --</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="priority">
                            <span data-i18n="labelPriority">Priority</span>
                            <span class="required" data-i18n="required">*</span>
                        </label>
                        <select id="priority" name="priority" class="form-select" required>
                            <option value="" data-i18n="placeholderPriority">-- Select priority --</option>
                            <option value="low" data-i18n="priorityLow">Low</option>
                            <option value="medium" selected data-i18n="priorityMedium">Medium</option>
                            <option value="high" data-i18n="priorityHigh">High</option>
                            <option value="urgent" data-i18n="priorityUrgent">Urgent</option>
                        </select>
                    </div>
                </div>

                <!-- Quota Info Banner (shown when vacation/sick selected) -->
                <div id="quotaInfoBanner" style="display:none;"></div>

                <!-- Date Range (for Vacation and Sick Leave) -->
                <div id="dateRangeContainer" class="form-row" style="display: none;">
                    <div class="form-group">
                        <label class="form-label" for="startDate">
                            <span data-i18n="labelStartDate">Start Date</span>
                            <span class="required" data-i18n="required">*</span>
                        </label>
                        <input
                            type="date"
                            id="startDate"
                            name="startDate"
                            class="form-input"
                            onchange="checkHalfDayToggle(); updateSelectedDaysInfo();"
                        >
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="endDate">
                            <span data-i18n="labelEndDate">End Date</span>
                            <span class="required" data-i18n="required">*</span>
                        </label>
                        <input
                            type="date"
                            id="endDate"
                            name="endDate"
                            class="form-input"
                            onchange="checkHalfDayToggle(); updateSelectedDaysInfo();"
                        >
                    </div>
                </div>

                <!-- Half-Day Toggle (shown only when single day selected) -->
                <div id="halfDayContainer" class="form-group" style="display: none;">
                    <label class="form-label">
                        <span data-i18n="halfDayLabel">Half-day</span>
                    </label>
                    <div class="half-day-toggle">
                        <button type="button" class="toggle-btn active" id="fullDayBtn" onclick="setHalfDay(false)">
                            <span data-i18n="halfDayFullDay">Full day</span>
                        </button>
                        <button type="button" class="toggle-btn" id="halfDayBtn" onclick="setHalfDay(true)">
                            <span data-i18n="halfDayHalfDay">Half day (0.5)</span>
                        </button>
                    </div>
                    <input type="hidden" id="isHalfDay" name="isHalfDay" value="false">
                    <p class="helper-text" data-i18n="halfDayHelperText">Select if you want to request only half a day off</p>
                </div>

                <!-- Approver -->
                <div class="form-group">
                    <label class="form-label" for="approver">
                        <span data-i18n="labelApprover">Approver</span>
                        <span class="required" data-i18n="required">*</span>
                    </label>
                    <select id="approver" name="approver" class="form-select" required>
                        <option value="" data-i18n="placeholderLoading">-- Loading users... --</option>
                    </select>
                    <p class="helper-text" data-i18n="helperApprover">Select the person who should approve this request</p>
                </div>

                <!-- Attachments -->
                <div class="form-group">
                    <label class="form-label" for="attachments">
                        <span data-i18n="labelAttachments">Attachments (optional)</span>
                    </label>
                    <input
                        type="file"
                        id="attachments"
                        name="attachments"
                        class="form-input"
                        accept=".jpg,.jpeg,.png,.pdf,.docx,.xlsx"
                        multiple
                    >
                    <p class="helper-text" data-i18n="helperAttachments">Allowed: JPG, PNG, PDF, DOCX, XLSX (max 10MB)</p>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
                    <span id="btnText" data-i18n="btnSubmit">Submit Request</span>
                    <span id="btnLoader" class="loading" style="display: none;"></span>
                </button>
            </form>
        </div>
    </div>

    <script src="/assets/js/app.js?v=20260317c"></script>
</body>
</html>
