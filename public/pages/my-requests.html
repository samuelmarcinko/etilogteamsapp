<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Requests - ETILOG Approval System</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <script src="https://res.cdn.office.net/teams-js/2.19.0/js/MicrosoftTeams.min.js"></script>
    <script src="/assets/js/i18n.js"></script>
    <script src="/assets/js/navigation.js"></script>
</head>
<body data-page="my-requests">
    <div class="lang-switcher">
        <button class="lang-btn active" data-lang="en" onclick="switchLanguage('en')">EN</button>
        <button class="lang-btn" data-lang="sk" onclick="switchLanguage('sk')">SK</button>
    </div>

    <div class="container">
        <div id="navContainer"></div>

        <div class="header">
            <img src="/assets/images/logo.png" alt="ETILOG Logo" class="logo">
            <div class="header-content">
                <h1 data-i18n="myRequestsTitle">My Requests</h1>
                <p data-i18n="myRequestsSubtitle">View and track your submitted requests</p>
            </div>
        </div>

        <div class="card">
            <h2 data-i18n="yourRequests">Your Requests</h2>
            <div id="myRequestsList" class="requests-list">
                <div class="loading-spinner">
                    <div class="loading"></div>
                    <p data-i18n="loadingYourRequests">Loading your requests...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global variable to store tickets
        let userTickets = [];

        // Helper function to translate ticket type
        function translateType(type) {
            const typeMap = {
                'vacation': 'typeVacation',
                'purchase': 'typePurchase',
                'expense': 'typeExpense',
                'hr': 'typeHr',
                'other': 'typeOther'
            };
            return t(typeMap[type.toLowerCase()] || 'typeOther');
        }

        // Helper function to translate priority
        function translatePriority(priority) {
            const priorityMap = {
                'low': 'priorityLow',
                'medium': 'priorityMedium',
                'high': 'priorityHigh',
                'urgent': 'priorityUrgent'
            };
            return t(priorityMap[priority.toLowerCase()] || 'priorityMedium');
        }

        // Render tickets function
        function renderTickets() {
            const container = document.getElementById('myRequestsList');
            if (userTickets.length === 0) {
                container.innerHTML = `<div class="empty-state"><p>${t('noRequestsFound')}</p></div>`;
            } else {
                container.innerHTML = userTickets.map(ticket => `
                    <div class="request-item">
                        <div class="request-header">
                            <h3 class="request-title">${ticket.title}</h3>
                            <span class="status-badge status-${ticket.status.toLowerCase()}">${t('status' + ticket.status)}</span>
                        </div>
                        <div class="request-meta">
                            <span class="meta-item"><strong>${t('labelType')}:</strong> ${translateType(ticket.ticket_type)}</span>
                            <span class="meta-item"><strong>${t('labelPriority')}:</strong> ${translatePriority(ticket.priority)}</span>
                            <span class="meta-item"><strong>${t('labelApprover')}:</strong> ${ticket.assigned_approver_name}</span>
                        </div>
                        <p class="request-description">${ticket.description}</p>
                        ${ticket.status === 'Rejected' && ticket.rejection_reason ? `
                            <div class="rejection-reason">
                                <strong>${t('labelRejectionReason')}:</strong> ${ticket.rejection_reason}
                            </div>
                        ` : ''}
                    </div>
                `).join('');
            }
        }

        // Override switchLanguage to re-render tickets
        const originalSwitchLanguage = window.switchLanguage;
        window.switchLanguage = function(lang) {
            originalSwitchLanguage(lang);
            renderTickets(); // Re-render tickets with new language
        };

        // Load user's requests
        (async function() {
            await microsoftTeams.app.initialize();
            const context = await microsoftTeams.app.getContext();
            const userId = context.user.id;

            try {
                const response = await fetch(`/api/tickets?createdById=${userId}`);
                const result = await response.json();
                userTickets = result.data || [];
                renderTickets();
            } catch (error) {
                document.getElementById('myRequestsList').innerHTML = `<div class="error-message"><p>${t('errorLoadingRequests')}</p></div>`;
            }
        })();
    </script>
</body>
</html>
