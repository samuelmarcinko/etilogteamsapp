<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Requests - ETILOG Approval System</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <script src="https://res.cdn.office.net/teams-js/2.19.0/js/MicrosoftTeams.min.js"></script>
    <script src="/assets/js/i18n.js"></script>
    <script src="/assets/js/navigation.js"></script>
</head>
<body data-page="my-requests">
    <div class="lang-switcher">
        <button class="lang-btn active" data-lang="en" onclick="switchLanguage('en')">EN</button>
        <button class="lang-btn" data-lang="sk" onclick="switchLanguage('sk')">SK</button>
    </div>

    <div class="container">
        <div id="navContainer"></div>

        <div class="header">
            <img src="/assets/images/logo.png" alt="ETILOG Logo" class="logo">
            <div class="header-content">
                <h1 data-i18n="myRequestsTitle">My Requests</h1>
                <p data-i18n="myRequestsSubtitle">View and track your submitted requests</p>
            </div>
        </div>

        <div class="card">
            <h2 data-i18n="yourRequests">Your Requests</h2>

            <!-- Filters Section -->
            <div class="filters-section">
                <div class="filters-row">
                    <div class="filter-group">
                        <label class="filter-label" data-i18n="filterSearch">Search</label>
                        <input type="text"
                               id="searchInput"
                               class="filter-input"
                               data-i18n-placeholder="filterSearchPlaceholder"
                               placeholder="Search by title or description...">
                    </div>
                    <div class="filter-group">
                        <label class="filter-label" data-i18n="filterApprover">Filter by Approver</label>
                        <select id="approverFilter" class="filter-select">
                            <option value="" data-i18n="filterApproverAll">-- All Approvers --</option>
                        </select>
                    </div>
                    <button class="filter-clear-btn" onclick="clearFilters()" data-i18n="filterClear">Clear Filters</button>
                </div>
            </div>

            <div id="myRequestsList" class="requests-list">
                <div class="loading-spinner">
                    <div class="loading"></div>
                    <p data-i18n="loadingYourRequests">Loading your requests...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global variables
        let userTickets = [];
        let filteredTickets = [];

        // Helper function to translate ticket type
        function translateType(type) {
            const typeMap = {
                'vacation': 'typeVacation',
                'purchase': 'typePurchase',
                'expense': 'typeExpense',
                'hr': 'typeHr',
                'other': 'typeOther'
            };
            return t(typeMap[type.toLowerCase()] || 'typeOther');
        }

        // Helper function to translate priority
        function translatePriority(priority) {
            const priorityMap = {
                'low': 'priorityLow',
                'medium': 'priorityMedium',
                'high': 'priorityHigh',
                'urgent': 'priorityUrgent'
            };
            return t(priorityMap[priority.toLowerCase()] || 'priorityMedium');
        }

        // Filter tickets based on search and approver filter
        function applyFilters() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const selectedApprover = document.getElementById('approverFilter').value;

            filteredTickets = userTickets.filter(ticket => {
                // Search filter
                const matchesSearch = !searchTerm ||
                    ticket.title.toLowerCase().includes(searchTerm) ||
                    ticket.description.toLowerCase().includes(searchTerm);

                // Approver filter
                const matchesApprover = !selectedApprover ||
                    ticket.assigned_approver_id === selectedApprover;

                return matchesSearch && matchesApprover;
            });

            renderTickets();
        }

        // Clear all filters
        function clearFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('approverFilter').value = '';
            applyFilters();
        }

        // Render tickets function
        function renderTickets() {
            const container = document.getElementById('myRequestsList');
            const ticketsToRender = filteredTickets;

            if (ticketsToRender.length === 0) {
                container.innerHTML = `<div class="empty-state"><p>${t('noRequestsFound')}</p></div>`;
            } else {
                container.innerHTML = ticketsToRender.map(ticket => `
                    <div class="request-item">
                        <div class="request-header">
                            <h3 class="request-title">${ticket.title}</h3>
                            <span class="status-badge status-${ticket.status.toLowerCase()}">${t('status' + ticket.status)}</span>
                        </div>
                        <div class="request-meta">
                            <span class="meta-item"><strong>${t('labelType')}:</strong> ${translateType(ticket.ticket_type)}</span>
                            <span class="meta-item"><strong>${t('labelPriority')}:</strong> ${translatePriority(ticket.priority)}</span>
                            <span class="meta-item"><strong>${t('labelApprover')}:</strong> ${ticket.assigned_approver_name}</span>
                        </div>
                        <p class="request-description">${ticket.description}</p>
                        ${ticket.status === 'Rejected' && ticket.rejection_reason ? `
                            <div class="rejection-reason">
                                <strong>${t('labelRejectionReason')}:</strong> ${ticket.rejection_reason}
                            </div>
                        ` : ''}
                    </div>
                `).join('');
            }
        }

        // Populate approver dropdown
        function populateApproverFilter() {
            const approverFilter = document.getElementById('approverFilter');
            const uniqueApprovers = [...new Set(userTickets.map(ticket => ({
                id: ticket.assigned_approver_id,
                name: ticket.assigned_approver_name
            })).map(JSON.stringify))].map(JSON.parse);

            // Clear existing options except "All"
            approverFilter.innerHTML = `<option value="" data-i18n="filterApproverAll">${t('filterApproverAll')}</option>`;

            // Add unique approvers
            uniqueApprovers.forEach(approver => {
                const option = document.createElement('option');
                option.value = approver.id;
                option.textContent = approver.name;
                approverFilter.appendChild(option);
            });
        }

        // Override switchLanguage to re-render tickets and update filters
        const originalSwitchLanguage = window.switchLanguage;
        window.switchLanguage = function(lang) {
            originalSwitchLanguage(lang);
            renderTickets();
            populateApproverFilter();
        };

        // Load user's requests
        (async function() {
            await microsoftTeams.app.initialize();
            const context = await microsoftTeams.app.getContext();
            const userId = context.user.id;

            try {
                const response = await fetch(`/api/tickets?createdById=${userId}`);
                const result = await response.json();
                userTickets = result.data || [];
                filteredTickets = userTickets;
                populateApproverFilter();
                renderTickets();

                // Add event listeners for filters
                document.getElementById('searchInput').addEventListener('input', applyFilters);
                document.getElementById('approverFilter').addEventListener('change', applyFilters);
            } catch (error) {
                document.getElementById('myRequestsList').innerHTML = `<div class="error-message"><p>${t('errorLoadingRequests')}</p></div>`;
            }
        })();
    </script>
</body>
</html>
