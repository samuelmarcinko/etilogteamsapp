<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Approvals - ETILOG Approval System</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <script src="https://res.cdn.office.net/teams-js/2.19.0/js/MicrosoftTeams.min.js"></script>
    <script src="/assets/js/i18n.js"></script>
    <script src="/assets/js/navigation.js"></script>
</head>
<body data-page="approvals">
    <div class="container">
        <div id="navContainer"></div>

        <div class="header">
            <img src="/assets/images/logo.png" alt="ETILOG Logo" class="logo">
            <div class="header-content">
                <h1 data-i18n="approvalsTitle">Pending Approvals</h1>
                <p data-i18n="approvalsSubtitle">Requests waiting for your approval</p>
            </div>
        </div>

        <div class="card">
            <!-- Tabs -->
            <div class="tabs-container">
                <div class="tabs">
                    <button class="tab-btn active" data-tab="pending" onclick="switchTab('pending')" data-i18n="tabPending">Pending</button>
                    <button class="tab-btn" data-tab="history" onclick="switchTab('history')" data-i18n="tabHistory">History</button>
                </div>
            </div>

            <!-- Pending Tab Content -->
            <div id="pendingTab" class="tab-content active">
                <h2 data-i18n="requestsToApprove">Requests to Approve</h2>
                <div id="approvalsList" class="requests-list">
                    <div class="loading-spinner">
                        <div class="loading"></div>
                        <p data-i18n="loadingApprovals">Loading pending approvals...</p>
                    </div>
                </div>
            </div>

            <!-- History Tab Content -->
            <div id="historyTab" class="tab-content" style="display: none;">
                <h2 data-i18n="approvalsHistory">Approval History</h2>

                <!-- Filters for History -->
                <div class="filters-section">
                    <div class="filters-row">
                        <div class="filter-group">
                            <label class="filter-label" data-i18n="filterStatus">Status</label>
                            <select id="historyStatusFilter" class="filter-select" onchange="applyHistoryFilters()">
                                <option value="" data-i18n="filterStatusAll">-- All --</option>
                                <option value="Approved" data-i18n="statusApproved">Approved</option>
                                <option value="Rejected" data-i18n="statusRejected">Rejected</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label class="filter-label" data-i18n="filterSearch">Search</label>
                            <input type="text"
                                   id="historySearchInput"
                                   class="filter-input"
                                   oninput="applyHistoryFilters()"
                                   data-i18n-placeholder="filterSearchPlaceholder"
                                   placeholder="Search by title or description...">
                        </div>
                        <button class="filter-clear-btn" onclick="clearHistoryFilters()" data-i18n="filterClear">Clear Filters</button>
                    </div>
                </div>

                <div id="historyList" class="requests-list">
                    <div class="loading-spinner">
                        <div class="loading"></div>
                        <p data-i18n="loadingHistory">Loading history...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Reject Reason Modal -->
    <div id="rejectModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 10000; justify-content: center; align-items: center;">
        <div style="background: white; padding: 30px; border-radius: 12px; max-width: 500px; width: 90%; box-shadow: 0 10px 25px rgba(0,0,0,0.3);">
            <h3 style="margin: 0 0 20px 0; color: #1f2937; font-size: 20px;" data-i18n="rejectModalTitle">Rejection Reason</h3>
            <textarea id="rejectionReasonInput" data-i18n-placeholder="rejectModalPlaceholder" placeholder="Please provide a reason for rejection..." style="width: 100%; min-height: 100px; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-family: inherit; font-size: 14px; resize: vertical;"></textarea>
            <div style="display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end;">
                <button onclick="closeRejectModal()" data-i18n="rejectModalCancel" style="padding: 10px 20px; background: #6b7280; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px;">Cancel</button>
                <button onclick="submitRejection()" data-i18n="rejectModalSubmit" style="padding: 10px 20px; background: #ef4444; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px;">Reject</button>
            </div>
        </div>
    </div>

    <!-- Attachments Modal -->
    <div id="attachmentsModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 10000; justify-content: center; align-items: center;">
        <div style="background: white; padding: 24px; border-radius: 12px; max-width: 620px; width: 92%; box-shadow: 0 10px 25px rgba(0,0,0,0.3); max-height: 80vh; overflow: auto;">
            <div style="display:flex; align-items:center; justify-content:space-between; gap:12px;">
                <h3 id="attachmentsModalTitle" style="margin: 0; color: #1f2937; font-size: 18px;"></h3>
                <button onclick="closeAttachmentsModal()" style="padding:6px 10px;border:none;border-radius:6px;background:#ef4444;color:#fff;cursor:pointer;font-size:16px;line-height:1;">&#10005;</button>
            </div>
            <div id="attachmentsModalBody" style="margin-top: 16px;"></div>
        </div>
    </div>

    <script>
        // Global context variable
        let teamsContext = null;
        let currentUser = null;
        let pendingRejectTicketId = null;
        let pendingTickets = [];
        let historyTickets = [];
        let filteredHistoryTickets = [];
        let attachmentCounts = new Map();

        // Switch between tabs
        function switchTab(tabName) {
            // Update tab buttons
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.getAttribute('data-tab') === tabName) {
                    btn.classList.add('active');
                }
            });

            // Update tab content
            document.querySelectorAll('.tab-content').forEach(content => {
                content.style.display = 'none';
                content.classList.remove('active');
            });

            if (tabName === 'pending') {
                document.getElementById('pendingTab').style.display = 'block';
                document.getElementById('pendingTab').classList.add('active');
            } else if (tabName === 'history') {
                document.getElementById('historyTab').style.display = 'block';
                document.getElementById('historyTab').classList.add('active');
                // Load history if not already loaded
                if (historyTickets.length === 0) {
                    loadHistory();
                }
            }
        }

        // Load approval history
        async function loadHistory() {
            if (!currentUser) return;

            const container = document.getElementById('historyList');
            container.innerHTML = `
                <div class="loading-spinner">
                    <div class="loading"></div>
                    <p>${t('loadingHistory')}</p>
                </div>
            `;

            try {
                const response = await fetch(`/api/tickets?assignedApproverId=${currentUser.id}`);
                const result = await response.json();
                const allTickets = result.data || [];

                // Filter only Approved and Rejected tickets
                historyTickets = allTickets.filter(t => t.status === 'Approved' || t.status === 'Rejected');
                filteredHistoryTickets = historyTickets;
                await loadAttachmentCounts(historyTickets);
                renderHistory();
            } catch (error) {
                console.error('Error loading history:', error);
                container.innerHTML = `<div class="error-message"><p>${t('errorLoadingHistory')}</p></div>`;
            }
        }

        // Render history tickets
        function renderHistory() {
            const container = document.getElementById('historyList');
            const tickets = filteredHistoryTickets;

            if (tickets.length === 0) {
                container.innerHTML = `<div class="empty-state"><p>${t('noHistoryFound')}</p></div>`;
                return;
            }

            container.innerHTML = tickets.map(ticket => `
                <div class="request-item">
                    <div class="request-header">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start; width: 100%;">
                            <h3 class="request-title">${ticket.title}</h3>
                            <span style="font-size: 0.7rem; color: #9ca3af; font-weight: 400; white-space: nowrap; margin-left: 0.5rem; flex-shrink: 0;">${ticket.ticket_id}</span>
                        </div>
                        <div style="display: flex; gap: 0.5rem; align-items: center;">
                            <span class="type-badge ${getTypeBadgeClass(ticket.ticket_type)}">${translateTicketType(ticket.ticket_type)}</span>
                            <span class="status-badge status-${ticket.status.toLowerCase()}">${t('status' + ticket.status)}</span>
                        </div>
                    </div>
                    <div class="request-meta">
                        <span class="priority-badge priority-${ticket.priority.toLowerCase()}">
                            ${ticket.priority === 'Urgent' ? '🔥' : ticket.priority === 'High' ? '⚠️' : ticket.priority === 'Low' ? '📌' : '📋'} ${t('labelPriorityLabel')}: ${translatePriority(ticket.priority)}
                        </span>
                        <span class="meta-item">
                            <strong>👤 ${t('labelCreatedBy')}:</strong> ${ticket.created_by_name}
                        </span>
                        <span class="meta-item">
                            <strong>📅 ${t('labelDate')}:</strong> ${new Date(ticket.updated_at).toLocaleDateString()}
                        </span>
                        ${['vacation', 'sick-leave', 'paragraph', 'ocr'].includes(ticket.ticket_type) && ticket.start_date && ticket.end_date ? `
                            <span class="meta-item">
                                <strong>📅</strong> ${formatDate(ticket.start_date)} → ${formatDate(ticket.end_date)}
                            </span>
                        ` : ''}
                    </div>
                    <div class="description-box">
                        <div class="description-header">${t('labelDescription')}</div>
                        <p class="request-description">${ticket.description}</p>
                    </div>
                    ${ticket.status === 'Rejected' && ticket.rejection_reason ? `
                        <div class="rejection-reason">
                            <strong>❌ ${t('labelRejectionReason')}:</strong> ${ticket.rejection_reason}
                        </div>
                    ` : ''}
                    ${attachmentCounts.get(ticket.ticket_id) ? `
                        <div class="request-actions">
                            <button class="btn-attachment" onclick="openAttachmentsModal('${ticket.ticket_id}', '${ticket.title.replace(/'/g, '&#39;')}')">
                                &#128206; ${t('attachments')}
                            </button>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        // Helper functions for translations
        function translateTicketType(type) {
            const typeMap = {
                'vacation': 'typeVacation',
                'sick-leave': 'typeSickLeave',
                'paragraph': 'typeParagraph',
                'ocr': 'typeOcr',
                'purchase': 'typePurchase',
                'expense': 'typeExpense',
                'hr': 'typeHr',
                'other': 'typeOther'
            };
            return t(typeMap[type?.toLowerCase()] || 'typeOther');
        }

        function translatePriority(priority) {
            const priorityMap = {
                'low': 'priorityLow',
                'medium': 'priorityMedium',
                'high': 'priorityHigh',
                'urgent': 'priorityUrgent'
            };
            return t(priorityMap[priority?.toLowerCase()] || 'priorityMedium');
        }

        // Helper function to get type badge class
        function getTypeBadgeClass(type) {
            const classMap = {
                'vacation': 'type-vacation',
                'sick-leave': 'type-sick-leave',
                'paragraph': 'type-paragraph',
                'ocr': 'type-ocr',
                'purchase': 'type-purchase',
                'expense': 'type-expense',
                'hr': 'type-hr',
                'other': 'type-other'
            };
            return classMap[type?.toLowerCase()] || 'type-other';
        }

        // Helper function to format date
        function formatDate(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            const lang = getCurrentLang();
            return date.toLocaleDateString(lang === 'sk' ? 'sk-SK' : 'en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
        }

        // Apply history filters
        function applyHistoryFilters() {
            const statusFilter = document.getElementById('historyStatusFilter').value;
            const searchTerm = document.getElementById('historySearchInput').value.toLowerCase();

            filteredHistoryTickets = historyTickets.filter(ticket => {
                const matchesStatus = !statusFilter || ticket.status === statusFilter;
                const matchesSearch = !searchTerm ||
                    ticket.title.toLowerCase().includes(searchTerm) ||
                    ticket.description.toLowerCase().includes(searchTerm) ||
                    ticket.created_by_name.toLowerCase().includes(searchTerm);

                return matchesStatus && matchesSearch;
            });

            renderHistory();
        }

        // Clear history filters
        function clearHistoryFilters() {
            document.getElementById('historyStatusFilter').value = '';
            document.getElementById('historySearchInput').value = '';
            applyHistoryFilters();
        }

        // Render pending tickets
        function renderPendingTickets() {
            const container = document.getElementById('approvalsList');
            if (pendingTickets.length === 0) {
                container.innerHTML = `<div class="empty-state"><p>${t('noPendingApprovals')}</p></div>`;
            } else {
                container.innerHTML = pendingTickets.map(ticket => `
                    <div class="request-item">
                        <div class="request-header">
                            <div style="display: flex; justify-content: space-between; align-items: flex-start; width: 100%;">
                                <h3 class="request-title">${ticket.title}</h3>
                                <span style="font-size: 0.7rem; color: #9ca3af; font-weight: 400; white-space: nowrap; margin-left: 0.5rem; flex-shrink: 0;">${ticket.ticket_id}</span>
                            </div>
                            <div style="display: flex; gap: 0.5rem; align-items: center;">
                                <span class="type-badge ${getTypeBadgeClass(ticket.ticket_type)}">${translateTicketType(ticket.ticket_type)}</span>
                                <span class="status-badge status-pending">${t('statusPending')}</span>
                            </div>
                        </div>
                        <div class="request-meta">
                            <span class="priority-badge priority-${ticket.priority.toLowerCase()}">
                                ${ticket.priority === 'Urgent' ? '🔥' : ticket.priority === 'High' ? '⚠️' : ticket.priority === 'Low' ? '📌' : '📋'} ${t('labelPriorityLabel')}: ${translatePriority(ticket.priority)}
                            </span>
                            <span class="meta-item">
                                <strong>👤 ${t('labelCreatedBy')}:</strong> ${ticket.created_by_name}
                            </span>
                            ${['vacation', 'sick-leave', 'paragraph', 'ocr'].includes(ticket.ticket_type) && ticket.start_date && ticket.end_date ? `
                                <span class="meta-item">
                                    <strong>📅</strong> ${formatDate(ticket.start_date)} → ${formatDate(ticket.end_date)}
                                </span>
                            ` : ''}
                        </div>
                        <div class="description-box">
                            <div class="description-header">${t('labelDescription')}</div>
                            <p class="request-description">${ticket.description}</p>
                        </div>
                        <div class="request-actions">
                            ${attachmentCounts.get(ticket.ticket_id) ? `
                                <button class="btn-attachment" onclick="openAttachmentsModal('${ticket.ticket_id}', '${ticket.title.replace(/'/g, '&#39;')}')">
                                    &#128206; ${t('attachments')}
                                </button>
                            ` : ''}
                            <button class="btn-success" data-action="approve" data-ticket-id="${ticket.ticket_id}">
                                ✓ ${t('btnApprove')}
                            </button>
                            <button class="btn-danger" data-action="reject" data-ticket-id="${ticket.ticket_id}">
                                ✗ ${t('btnReject')}
                            </button>
                        </div>
                    </div>
                `).join('');
            }
        }

        // Load pending approvals
        (async function() {
            await microsoftTeams.app.initialize();
            teamsContext = await microsoftTeams.app.getContext();
            currentUser = teamsContext.user;
            const userId = currentUser.id;

            try {
                const response = await fetch(`/api/tickets?assignedApproverId=${userId}&status=Pending`);
                const result = await response.json();
                pendingTickets = result.data || [];
                await loadAttachmentCounts(pendingTickets);
                renderPendingTickets();
            } catch (error) {
                document.getElementById('approvalsList').innerHTML = `<div class="error-message"><p>${t('errorLoadingApprovals')}</p></div>`;
            }
        })();

        async function loadAttachmentCounts(tickets) {
            if (!tickets.length) return;
            const entries = await Promise.all(tickets.map(async (ticket) => {
                try {
                    const response = await fetch(`/api/tickets/${ticket.ticket_id}/attachments`);
                    if (!response.ok) return [ticket.ticket_id, 0];
                    const result = await response.json();
                    return [ticket.ticket_id, (result.data || []).length];
                } catch (error) {
                    return [ticket.ticket_id, 0];
                }
            }));
            entries.forEach(([ticketId, count]) => attachmentCounts.set(ticketId, count));
        }

        // Event delegation for approve/reject buttons
        document.getElementById('approvalsList').addEventListener('click', function(e) {
            const button = e.target.closest('button[data-action]');
            if (!button) return;

            const action = button.getAttribute('data-action');
            const ticketId = button.getAttribute('data-ticket-id');

            console.log('Button clicked:', action, ticketId);

            if (action === 'approve') {
                approveTicket(ticketId);
            } else if (action === 'reject') {
                rejectTicket(ticketId);
            }
        });

        function closeAttachmentsModal() {
            document.getElementById('attachmentsModal').style.display = 'none';
        }

        async function openAttachmentsModal(ticketId, title) {
            const modal = document.getElementById('attachmentsModal');
            const body = document.getElementById('attachmentsModalBody');
            document.getElementById('attachmentsModalTitle').textContent = `${t('attachments')}: ${title}`;
            body.innerHTML = `<p>${t('loadingHistory')}</p>`;
            modal.style.display = 'flex';

            try {
                const response = await fetch(`/api/tickets/${ticketId}/attachments`);
                const result = await response.json();
                const attachments = result.data || [];

                if (!attachments.length) {
                    body.innerHTML = `<p>${t('noAttachments')}</p>`;
                    return;
                }

                body.innerHTML = `
                    <div style="display:flex;flex-direction:column;gap:12px;">
                        ${attachments.map(att => `
                            <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:10px;border-bottom:1px solid #e5e7eb;">
                                <div>
                                    <div style="font-weight:600;">${att.file_name}</div>
                                    <div style="color:#6b7280;font-size:12px;">${att.file_type || ''}</div>
                                </div>
                                <div style="display:flex;gap:8px;">
                                    <button class="btn-secondary" onclick="previewTicketAttachment('${ticketId}', ${att.attachment_id}, '${att.file_name.replace(/'/g, '&#39;')}')">${t('viewAttachments')}</button>
                                    <a class="btn btn-primary" href="/api/tickets/${ticketId}/attachments/${att.attachment_id}" target="_blank" rel="noopener">${t('download')}</a>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } catch (error) {
                body.innerHTML = `<p>${t('errorLoadingApprovals')}</p>`;
            }
        }

        async function previewTicketAttachment(ticketId, attachmentId, fileName) {
            try {
                const response = await fetch(`/api/tickets/${ticketId}/attachments/${attachmentId}`);
                if (!response.ok) throw new Error('File not found');
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                showFileLightbox(url, fileName);
            } catch (error) {
                console.error('Failed to preview attachment:', error);
            }
        }

        function showFileLightbox(url, fileName) {
            const existing = document.getElementById('fileLightbox');
            if (existing) existing.remove();

            const ext = fileName.toLowerCase().split('.').pop();
            const isImage = ['jpg', 'jpeg', 'png'].includes(ext);
            const isPdf = ext === 'pdf';

            const overlay = document.createElement('div');
            overlay.id = 'fileLightbox';
            overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:11000;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);';

            const cleanup = () => {
                overlay.remove();
                window.URL.revokeObjectURL(url);
                document.removeEventListener('keydown', escHandler);
            };

            overlay.onclick = (e) => { if (e.target === overlay) cleanup(); };

            const wrapper = document.createElement('div');
            wrapper.style.cssText = 'position:relative;max-width:90vw;max-height:90vh;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 25px 50px rgba(0,0,0,0.3);';

            const header = document.createElement('div');
            header.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#f9fafb;border-bottom:1px solid #e5e7eb;';
            const title = document.createElement('span');
            title.style.cssText = 'font-weight:600;font-size:14px;color:#374151;';
            title.textContent = fileName;
            const closeBtn = document.createElement('button');
            closeBtn.type = 'button';
            closeBtn.style.cssText = 'padding:6px 10px;border:none;border-radius:6px;background:#ef4444;color:#fff;cursor:pointer;font-size:16px;line-height:1;';
            closeBtn.innerHTML = '&#10005;';
            closeBtn.addEventListener('click', cleanup);
            header.appendChild(title);
            header.appendChild(closeBtn);

            const content = document.createElement('div');
            content.style.cssText = 'display:flex;align-items:center;justify-content:center;max-height:calc(90vh - 52px);overflow:auto;';

            if (isImage) {
                const img = document.createElement('img');
                img.src = url;
                img.style.cssText = 'max-width:88vw;max-height:calc(90vh - 60px);object-fit:contain;';
                content.appendChild(img);
            } else if (isPdf) {
                const iframe = document.createElement('iframe');
                iframe.src = url;
                iframe.style.cssText = 'width:88vw;height:calc(90vh - 60px);border:none;';
                content.appendChild(iframe);
            } else {
                content.innerHTML = `<div style="padding:40px;text-align:center;"><p>${t('previewNotAvailable')}</p><a href="${url}" download="${fileName}" style="color:#2563eb;">${t('download')}</a></div>`;
            }

            wrapper.appendChild(header);
            wrapper.appendChild(content);
            overlay.appendChild(wrapper);
            document.body.appendChild(overlay);

            const escHandler = (e) => { if (e.key === 'Escape') cleanup(); };
            document.addEventListener('keydown', escHandler);
        }

        // Approve ticket
        async function approveTicket(ticketId) {
            console.log('Approve clicked for ticket:', ticketId);
            console.log('Current user:', currentUser);

            if (!currentUser) {
                showMessage(t('approveError') + ': User context not loaded', 'error');
                return;
            }

            try {
                const payload = {
                    approver_id: currentUser.id,
                    approver_name: currentUser.displayName || currentUser.userPrincipalName,
                    approver_email: currentUser.userPrincipalName
                };
                console.log('Sending approve request with payload:', payload);

                const response = await fetch(`/api/tickets/${ticketId}/approve`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                console.log('Approve response status:', response.status);

                if (response.ok) {
                    showMessage(t('approveSuccess'), 'success');
                    // Refresh approval badge count
                    if (window.refreshApprovalsBadge) {
                        window.refreshApprovalsBadge();
                    }
                    setTimeout(() => location.reload(), 1500);
                } else {
                    const errorData = await response.json().catch(() => null);
                    console.error('Approve failed:', errorData);
                    showMessage(t('approveFailed') + (errorData?.message ? ': ' + errorData.message : ''), 'error');
                }
            } catch (error) {
                console.error('Error approving ticket:', error);
                showMessage(t('approveError') + ': ' + error.message, 'error');
            }
        }

        // Reject ticket - open modal
        function rejectTicket(ticketId) {
            console.log('Reject clicked for ticket:', ticketId);

            if (!currentUser) {
                showMessage(t('rejectError') + ': User context not loaded', 'error');
                return;
            }

            pendingRejectTicketId = ticketId;
            document.getElementById('rejectModal').style.display = 'flex';
            document.getElementById('rejectionReasonInput').value = '';
            document.getElementById('rejectionReasonInput').focus();
        }

        // Close reject modal
        function closeRejectModal() {
            document.getElementById('rejectModal').style.display = 'none';
            pendingRejectTicketId = null;
        }

        // Submit rejection with reason
        async function submitRejection() {
            const reason = document.getElementById('rejectionReasonInput').value.trim();

            if (!reason) {
                showMessage(t('rejectModalError'), 'error');
                return;
            }

            // Don't close modal yet - we need pendingRejectTicketId!
            const ticketId = pendingRejectTicketId;

            try {
                const payload = {
                    rejectionReason: reason,
                    rejector_id: currentUser.id,
                    rejector_name: currentUser.displayName || currentUser.userPrincipalName,
                    rejector_email: currentUser.userPrincipalName
                };
                console.log('Sending reject request with payload:', payload);

                const response = await fetch(`/api/tickets/${ticketId}/reject`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                console.log('Reject response status:', response.status);

                if (response.ok) {
                    closeRejectModal();
                    showMessage(t('rejectSuccess'), 'success');
                    // Refresh approval badge count
                    if (window.refreshApprovalsBadge) {
                        window.refreshApprovalsBadge();
                    }
                    setTimeout(() => location.reload(), 1500);
                } else {
                    const errorData = await response.json().catch(() => null);
                    console.error('Reject failed:', errorData);
                    closeRejectModal();
                    showMessage(t('rejectFailed') + (errorData?.message ? ': ' + errorData.message : ''), 'error');
                }
            } catch (error) {
                console.error('Error rejecting ticket:', error);
                closeRejectModal();
                showMessage(t('rejectError') + ': ' + error.message, 'error');
            }
        }

        // Show message helper (replaces alert/confirm for Teams compatibility)
        function showMessage(message, type = 'info') {
            const messageDiv = document.createElement('div');
            messageDiv.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                padding: 15px 20px;
                background: ${type === 'success' ? '#10b981' : type === 'error' ? '#ef4444' : '#3b82f6'};
                color: white;
                border-radius: 8px;
                box-shadow: 0 4px 6px rgba(0,0,0,0.1);
                z-index: 10000;
                font-size: 14px;
                max-width: 300px;
            `;
            messageDiv.textContent = message;
            document.body.appendChild(messageDiv);

            setTimeout(() => {
                messageDiv.style.transition = 'opacity 0.3s';
                messageDiv.style.opacity = '0';
                setTimeout(() => messageDiv.remove(), 300);
            }, 3000);
        }

        // Override switchLanguage to re-render ticket boxes with new translations
        const originalSwitchLanguage = window.switchLanguage;
        window.switchLanguage = function(lang) {
            originalSwitchLanguage(lang);
            // Re-render pending and history tickets with new translations
            renderPendingTickets();
            renderHistory();
        };
    </script>
</body>
</html>
