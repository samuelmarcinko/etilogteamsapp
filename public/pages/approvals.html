<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Approvals - ETILOG Approval System</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <script src="https://res.cdn.office.net/teams-js/2.19.0/js/MicrosoftTeams.min.js"></script>
    <script src="/assets/js/i18n.js"></script>
    <script src="/assets/js/navigation.js"></script>
</head>
<body data-page="approvals">
    <div class="lang-switcher">
        <button class="lang-btn active" data-lang="en" onclick="switchLanguage('en')">EN</button>
        <button class="lang-btn" data-lang="sk" onclick="switchLanguage('sk')">SK</button>
    </div>

    <div class="container">
        <div id="navContainer"></div>

        <div class="header">
            <img src="/assets/images/logo.png" alt="ETILOG Logo" class="logo">
            <div class="header-content">
                <h1 data-i18n="approvalsTitle">Pending Approvals</h1>
                <p data-i18n="approvalsSubtitle">Requests waiting for your approval</p>
            </div>
        </div>

        <div class="card">
            <h2 data-i18n="requestsToApprove">Requests to Approve</h2>
            <div id="approvalsList" class="requests-list">
                <div class="loading-spinner">
                    <div class="loading"></div>
                    <p data-i18n="loadingApprovals">Loading pending approvals...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global context variable
        let teamsContext = null;
        let currentUser = null;

        // Load pending approvals
        (async function() {
            await microsoftTeams.app.initialize();
            teamsContext = await microsoftTeams.app.getContext();
            currentUser = teamsContext.user;
            const userId = currentUser.id;
            
            try {
                const response = await fetch(`/api/tickets?assignedApproverId=${userId}&status=Pending`);
                const result = await response.json();
                const tickets = result.data || [];

                const container = document.getElementById('approvalsList');
                if (tickets.length === 0) {
                    container.innerHTML = `<div class="empty-state"><p>${t('noPendingApprovals')}</p></div>`;
                } else {
                    container.innerHTML = tickets.map(ticket => `
                        <div class="request-item">
                            <div class="request-header">
                                <h3 class="request-title">${ticket.title}</h3>
                                <span class="status-badge status-pending">${t('statusPending')}</span>
                            </div>
                            <div class="request-meta">
                                <span class="meta-item"><strong>${t('labelType')}:</strong> ${ticket.ticket_type}</span>
                                <span class="meta-item"><strong>${t('labelPriority')}:</strong> ${ticket.priority}</span>
                                <span class="meta-item"><strong>${t('labelCreatedBy')}:</strong> ${ticket.created_by_name}</span>
                            </div>
                            <p class="request-description">${ticket.description}</p>
                            <div class="request-actions">
                                <button class="btn btn-success" data-action="approve" data-ticket-id="${ticket.ticket_id}">
                                    ✓ ${t('btnApprove')}
                                </button>
                                <button class="btn btn-danger" data-action="reject" data-ticket-id="${ticket.ticket_id}">
                                    ✗ ${t('btnReject')}
                                </button>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (error) {
                document.getElementById('approvalsList').innerHTML = `<div class="error-message"><p>${t('errorLoadingApprovals')}</p></div>`;
            }
        })();

        // Event delegation for approve/reject buttons
        document.getElementById('approvalsList').addEventListener('click', function(e) {
            const button = e.target.closest('button[data-action]');
            if (!button) return;

            const action = button.getAttribute('data-action');
            const ticketId = button.getAttribute('data-ticket-id');

            console.log('Button clicked:', action, ticketId);

            if (action === 'approve') {
                approveTicket(ticketId);
            } else if (action === 'reject') {
                rejectTicket(ticketId);
            }
        });

        // Approve ticket
        async function approveTicket(ticketId) {
            console.log('Approve clicked for ticket:', ticketId);
            console.log('Current user:', currentUser);

            if (!currentUser) {
                showMessage(t('approveError') + ': User context not loaded', 'error');
                return;
            }

            try {
                const payload = {
                    approver_id: currentUser.id,
                    approver_name: currentUser.displayName || currentUser.userPrincipalName,
                    approver_email: currentUser.userPrincipalName
                };
                console.log('Sending approve request with payload:', payload);

                const response = await fetch(`/api/tickets/${ticketId}/approve`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                console.log('Approve response status:', response.status);

                if (response.ok) {
                    showMessage(t('approveSuccess'), 'success');
                    setTimeout(() => location.reload(), 1500);
                } else {
                    const errorData = await response.json().catch(() => null);
                    console.error('Approve failed:', errorData);
                    showMessage(t('approveFailed') + (errorData?.message ? ': ' + errorData.message : ''), 'error');
                }
            } catch (error) {
                console.error('Error approving ticket:', error);
                showMessage(t('approveError') + ': ' + error.message, 'error');
            }
        }

        // Reject ticket
        async function rejectTicket(ticketId) {
            console.log('Reject clicked for ticket:', ticketId);
            console.log('Current user:', currentUser);

            if (!currentUser) {
                showMessage(t('rejectError') + ': User context not loaded', 'error');
                return;
            }

            // For now, use a simple default reason. Later we can implement Teams Task Module for input
            const reason = 'Rejected by approver';

            try {
                const payload = {
                    rejectionReason: reason,
                    rejector_id: currentUser.id,
                    rejector_name: currentUser.displayName || currentUser.userPrincipalName,
                    rejector_email: currentUser.userPrincipalName
                };
                console.log('Sending reject request with payload:', payload);

                const response = await fetch(`/api/tickets/${ticketId}/reject`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                console.log('Reject response status:', response.status);

                if (response.ok) {
                    showMessage(t('rejectSuccess'), 'success');
                    setTimeout(() => location.reload(), 1500);
                } else {
                    const errorData = await response.json().catch(() => null);
                    console.error('Reject failed:', errorData);
                    showMessage(t('rejectFailed') + (errorData?.message ? ': ' + errorData.message : ''), 'error');
                }
            } catch (error) {
                console.error('Error rejecting ticket:', error);
                showMessage(t('rejectError') + ': ' + error.message, 'error');
            }
        }

        // Show message helper (replaces alert/confirm for Teams compatibility)
        function showMessage(message, type = 'info') {
            const messageDiv = document.createElement('div');
            messageDiv.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                padding: 15px 20px;
                background: ${type === 'success' ? '#10b981' : type === 'error' ? '#ef4444' : '#3b82f6'};
                color: white;
                border-radius: 8px;
                box-shadow: 0 4px 6px rgba(0,0,0,0.1);
                z-index: 10000;
                font-size: 14px;
                max-width: 300px;
            `;
            messageDiv.textContent = message;
            document.body.appendChild(messageDiv);

            setTimeout(() => {
                messageDiv.style.transition = 'opacity 0.3s';
                messageDiv.style.opacity = '0';
                setTimeout(() => messageDiv.remove(), 300);
            }, 3000);
        }
    </script>
</body>
</html>
