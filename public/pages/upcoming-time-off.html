<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Calendar - ETILOG Approval System</title>
    <link rel="stylesheet" href="/assets/css/style.css?v=20260317a">
    <script src="https://res.cdn.office.net/teams-js/2.19.0/js/MicrosoftTeams.min.js"></script>
    <script src="/assets/js/i18n.js?v=20260317a"></script>
    <script src="/assets/js/navigation.js?v=20260317a"></script>
</head>
<body data-page="upcoming-time-off">
    <div class="container">
        <div id="navContainer"></div>

        <div class="header">
            <img src="/assets/images/logo.png" alt="ETILOG Logo" class="logo">
            <div class="header-content">
                <h1 data-i18n="teamCalendarTitle">Team Calendar</h1>
                <p data-i18n="teamCalendarSubtitle">See who's off in selected date range</p>
            </div>
        </div>

        <!-- Date Range Filter -->
        <div class="card date-filter-card">
            <div class="date-filter-row">
                <div class="date-filter-inputs">
                    <div class="date-input-group">
                        <label for="dateFrom" data-i18n="calendarDateFrom">From</label>
                        <input type="date" id="dateFrom" class="date-input">
                    </div>
                    <div class="date-input-group">
                        <label for="dateTo" data-i18n="calendarDateTo">To</label>
                        <input type="date" id="dateTo" class="date-input">
                    </div>
                    <button id="applyFilterBtn" class="apply-filter-btn" data-i18n="calendarApplyFilter">Apply</button>
                </div>
                <div class="quick-filters">
                    <button class="quick-filter-btn" data-range="today" data-i18n="calendarQuickToday">Today</button>
                    <button class="quick-filter-btn" data-range="week" data-i18n="calendarQuickWeek">This week</button>
                    <button class="quick-filter-btn active" data-range="month" data-i18n="calendarQuickMonth">This month</button>
                </div>
            </div>
        </div>

        <div class="card">
            <!-- Calendar Results -->
            <div id="calendarResults">
                <div class="loading-spinner">
                    <div class="loading"></div>
                    <p data-i18n="loadingCalendar">Loading calendar...</p>
                </div>
            </div>
        </div>
    </div>

    <style>
        /* Compact Date Filter */
        .date-filter-card {
            margin-bottom: 0.75rem;
            padding: 0.6rem 1rem;
            background: #fff;
        }

        .date-filter-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .date-filter-inputs {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .date-input-group {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .date-input-group label {
            font-size: 0.7rem;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .date-input {
            padding: 0.35rem 0.5rem;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            font-size: 0.8rem;
            min-width: 120px;
            background: #fff;
            color: #1f2937;
        }

        .date-input:focus {
            outline: none;
            border-color: var(--etilog-red, #d9000c);
            box-shadow: 0 0 0 2px rgba(217, 0, 12, 0.1);
        }

        .apply-filter-btn {
            padding: 0.35rem 0.9rem;
            background: var(--etilog-red, #d9000c);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            height: 30px;
        }

        .apply-filter-btn:hover {
            background: var(--etilog-red-hover, #b30009);
        }

        .quick-filters {
            display: flex;
            gap: 0.35rem;
            margin-left: auto;
        }

        .quick-filter-btn {
            padding: 0.3rem 0.6rem;
            background: #fff;
            color: #6b7280;
            border: 1px solid #e5e7eb;
            border-radius: 5px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }

        .quick-filter-btn:hover {
            background: #f9fafb;
            border-color: var(--etilog-red, #d9000c);
            color: var(--etilog-red, #d9000c);
        }

        .quick-filter-btn.active {
            background: var(--etilog-red, #d9000c);
            color: #fff;
            border-color: var(--etilog-red, #d9000c);
        }

        /* Calendar day section - compact */
        .calendar-day-section {
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #e5e7eb;
        }

        .calendar-day-section:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .calendar-day-heading {
            font-size: 0.95rem;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 0.6rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .calendar-day-heading .day-date {
            color: #9ca3af;
            font-weight: 400;
            font-size: 0.8rem;
        }

        .calendar-day-heading .day-badge {
            background: var(--etilog-red-light, rgba(217, 0, 12, 0.1));
            color: var(--etilog-red, #d9000c);
            font-size: 0.65rem;
            font-weight: 600;
            padding: 0.15rem 0.4rem;
            border-radius: 3px;
            text-transform: uppercase;
        }

        .calendar-day-heading .day-badge.today {
            background: #dcfce7;
            color: #15803d;
        }

        .calendar-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 0.5rem;
        }

        .calendar-empty {
            text-align: center;
            padding: 1rem;
            background: #f9fafb;
            border-radius: 6px;
            color: #6b7280;
            font-size: 0.85rem;
        }

        /* Person Card - compact */
        .person-card {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 0.6rem 0.75rem;
            transition: all 0.15s ease;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
        }

        .person-card:hover {
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
            border-color: #d1d5db;
        }

        .person-card.vacation {
            border-left: 3px solid #3b82f6;
        }

        .person-card.sick-leave {
            border-left: 3px solid #f59e0b;
        }

        .person-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.35rem;
        }

        .person-icon {
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .person-info {
            flex: 1;
            min-width: 0;
        }

        .person-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: #1f2937;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .person-email {
            display: none; /* Hide email to save space */
        }

        .person-type-badge {
            font-size: 0.6rem;
            color: #6b7280;
            background: #f3f4f6;
            padding: 0.15rem 0.35rem;
            border-radius: 3px;
            flex-shrink: 0;
        }

        .person-dates {
            font-size: 0.75rem;
            color: #6b7280;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .person-dates strong {
            color: #4b5563;
            font-size: 0.8rem;
        }

        .ticket-id-small {
            display: none; /* Hide ticket ID to save space */
        }

        .no-results-message {
            text-align: center;
            padding: 2rem 1rem;
            color: #6b7280;
        }

        .no-results-message .icon {
            font-size: 2.5rem;
            margin-bottom: 0.75rem;
        }

        .no-results-message p {
            font-size: 0.9rem;
            margin: 0;
        }

        @media (max-width: 600px) {
            .date-filter-row {
                flex-direction: column;
                align-items: stretch;
                gap: 0.5rem;
            }

            .date-filter-inputs {
                flex-wrap: wrap;
            }

            .quick-filters {
                margin-left: 0;
                justify-content: flex-start;
            }

            .calendar-list {
                grid-template-columns: 1fr;
            }
        }
    </style>

    <script>
        let allApprovedTimeOff = [];
        let currentDateFrom = null;
        let currentDateTo = null;

        // Format date for display
        function formatDate(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            const lang = getCurrentLang();
            return date.toLocaleDateString(lang === 'sk' ? 'sk-SK' : 'en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
        }

        // Format date for day heading
        function formatDayHeading(date) {
            const lang = getCurrentLang();
            const options = { weekday: 'long', day: 'numeric', month: 'long' };
            return date.toLocaleDateString(lang === 'sk' ? 'sk-SK' : 'en-US', options);
        }

        // Check if date is today
        function isToday(date) {
            const today = new Date();
            return date.toDateString() === today.toDateString();
        }

        // Check if person is off on specific date
        function isPersonOffOnDate(ticket, targetDate) {
            const start = new Date(ticket.start_date);
            const end = new Date(ticket.end_date);
            const target = new Date(targetDate);

            start.setHours(0, 0, 0, 0);
            end.setHours(0, 0, 0, 0);
            target.setHours(0, 0, 0, 0);

            return target >= start && target <= end;
        }

        // Get array of dates between from and to
        function getDateRange(fromDate, toDate) {
            const dates = [];
            const current = new Date(fromDate);
            const end = new Date(toDate);

            current.setHours(0, 0, 0, 0);
            end.setHours(0, 0, 0, 0);

            while (current <= end) {
                dates.push(new Date(current));
                current.setDate(current.getDate() + 1);
            }

            return dates;
        }

        // Render person card
        function renderPersonCard(ticket) {
            const typeClass = ticket.ticket_type === 'vacation' ? 'vacation' : 'sick-leave';
            const icon = ticket.ticket_type === 'vacation' ? '&#127796;' : '&#129298;';
            const typeLabel = ticket.ticket_type === 'vacation' ? t('typeVacation') : t('typeSickLeave');

            return `
                <div class="person-card ${typeClass}">
                    <div class="person-header">
                        <span class="person-icon">${icon}</span>
                        <div class="person-info">
                            <h3 class="person-name">${ticket.created_by_name}</h3>
                        </div>
                        <span class="person-type-badge">${typeLabel}</span>
                    </div>
                    <div class="person-dates">
                        ${formatDate(ticket.start_date)} &rarr; ${formatDate(ticket.end_date)}
                    </div>
                </div>
            `;
        }

        // Render calendar grouped by day
        function renderCalendar() {
            const container = document.getElementById('calendarResults');

            if (!currentDateFrom || !currentDateTo) {
                container.innerHTML = `
                    <div class="no-results-message">
                        <div class="icon">&#128197;</div>
                        <p>${t('calendarDateFrom')} / ${t('calendarDateTo')}</p>
                    </div>
                `;
                return;
            }

            const dateRange = getDateRange(currentDateFrom, currentDateTo);
            let hasAnyResults = false;
            let html = '';

            for (const date of dateRange) {
                const peopleOff = allApprovedTimeOff.filter(ticket => isPersonOffOnDate(ticket, date));

                if (peopleOff.length > 0) {
                    hasAnyResults = true;
                    const todayBadge = isToday(date) ? `<span class="day-badge today">${t('calendarToday')}</span>` : '';

                    html += `
                        <div class="calendar-day-section">
                            <h2 class="calendar-day-heading">
                                &#128197; ${formatDayHeading(date)}
                                ${todayBadge}
                                <span class="day-date">(${peopleOff.length})</span>
                            </h2>
                            <div class="calendar-list">
                                ${peopleOff.map(ticket => renderPersonCard(ticket)).join('')}
                            </div>
                        </div>
                    `;
                }
            }

            if (!hasAnyResults) {
                html = `
                    <div class="no-results-message">
                        <div class="icon">&#9989;</div>
                        <p>${t('calendarNoOneOff')}</p>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        // Format date for input field (YYYY-MM-DD) in local timezone
        function formatDateForInput(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // Set date range and render
        function setDateRange(fromDate, toDate) {
            currentDateFrom = fromDate;
            currentDateTo = toDate;

            document.getElementById('dateFrom').value = formatDateForInput(fromDate);
            document.getElementById('dateTo').value = formatDateForInput(toDate);

            renderCalendar();
        }

        // Quick filter handlers
        function setQuickFilter(range) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            let fromDate, toDate;

            switch (range) {
                case 'today':
                    fromDate = new Date(today);
                    toDate = new Date(today);
                    break;
                case 'week':
                    fromDate = new Date(today);
                    const dayOfWeek = today.getDay();
                    const daysUntilSunday = 7 - dayOfWeek;
                    toDate = new Date(today);
                    toDate.setDate(toDate.getDate() + daysUntilSunday);
                    break;
                case 'month':
                default:
                    fromDate = new Date(today.getFullYear(), today.getMonth(), 1); // First day of month
                    toDate = new Date(today.getFullYear(), today.getMonth() + 1, 0); // Last day of month
                    break;
            }

            // Update active button
            document.querySelectorAll('.quick-filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.range === range);
            });

            setDateRange(fromDate, toDate);
        }

        // Initialize
        (async function() {
            await microsoftTeams.app.initialize();

            // Set up event listeners
            document.getElementById('applyFilterBtn').addEventListener('click', () => {
                const fromValue = document.getElementById('dateFrom').value;
                const toValue = document.getElementById('dateTo').value;

                if (fromValue && toValue) {
                    currentDateFrom = new Date(fromValue);
                    currentDateTo = new Date(toValue);

                    // Clear quick filter active state
                    document.querySelectorAll('.quick-filter-btn').forEach(btn => {
                        btn.classList.remove('active');
                    });

                    renderCalendar();
                }
            });

            document.querySelectorAll('.quick-filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    setQuickFilter(btn.dataset.range);
                });
            });

            // Enter key on date inputs
            document.querySelectorAll('.date-input').forEach(input => {
                input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        document.getElementById('applyFilterBtn').click();
                    }
                });
            });

            try {
                // Fetch all approved vacation and sick-leave tickets
                const response = await fetch('/api/tickets?status=Approved');
                const result = await response.json();
                const allTickets = result.data || [];

                // Filter only vacation and sick-leave with dates
                allApprovedTimeOff = allTickets.filter(ticket =>
                    (ticket.ticket_type === 'vacation' || ticket.ticket_type === 'sick-leave') &&
                    ticket.start_date &&
                    ticket.end_date
                );

                // Default: show this month
                setQuickFilter('month');

            } catch (error) {
                console.error('Error loading time-off calendar:', error);
                document.getElementById('calendarResults').innerHTML = `
                    <div class="no-results-message">
                        <div class="icon">&#10060;</div>
                        <p>${t('errorLoadingCalendar')}</p>
                    </div>
                `;
            }
        })();

        // Re-render on language switch
        const originalSwitchLanguage = window.switchLanguage;
        window.switchLanguage = function(lang) {
            originalSwitchLanguage(lang);
            renderCalendar();
            // Update quick filter button texts
            document.querySelectorAll('.quick-filter-btn').forEach(btn => {
                const key = 'calendarQuick' + btn.dataset.range.charAt(0).toUpperCase() + btn.dataset.range.slice(1);
                if (translations[lang][key]) {
                    btn.textContent = translations[lang][key];
                }
            });
        };
    </script>
</body>
</html>
