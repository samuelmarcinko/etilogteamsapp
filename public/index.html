<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETILOG Approval System</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <script src="https://res.cdn.office.net/teams-js/2.19.0/js/MicrosoftTeams.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <img src="/assets/images/logo.png" alt="ETILOG Logo" class="logo">
            <div class="header-content">
                <h1>Systém schvaľovania žiadostí</h1>
                <p>Vytvorte novú žiadosť o schválenie</p>
            </div>
        </div>

        <!-- Success/Error Messages -->
        <div id="alertContainer"></div>

        <!-- Main Form Card -->
        <div class="card">
            <form id="approvalForm">
                <!-- Názov žiadosti -->
                <div class="form-group">
                    <label class="form-label" for="title">
                        Názov žiadosti <span class="required">*</span>
                    </label>
                    <input 
                        type="text" 
                        id="title" 
                        name="title" 
                        class="form-input" 
                        placeholder="Napr. Schválenie dovolenky"
                        required
                    >
                </div>

                <!-- Popis -->
                <div class="form-group">
                    <label class="form-label" for="description">
                        Popis <span class="required">*</span>
                    </label>
                    <textarea 
                        id="description" 
                        name="description" 
                        class="form-textarea" 
                        placeholder="Popíšte detaily vašej žiadosti..."
                        required
                    ></textarea>
                    <p class="helper-text">Uveďte všetky relevantné informácie</p>
                </div>

                <!-- Typ a Priorita (2 stĺpce) -->
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="ticketType">
                            Typ žiadosti <span class="required">*</span>
                        </label>
                        <select id="ticketType" name="ticketType" class="form-select" required>
                            <option value="">-- Vyberte typ --</option>
                            <option value="vacation">Dovolenka</option>
                            <option value="purchase">Nákup</option>
                            <option value="expense">Výdavky</option>
                            <option value="hr">HR záležitosti</option>
                            <option value="other">Iné</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="priority">
                            Priorita <span class="required">*</span>
                        </label>
                        <select id="priority" name="priority" class="form-select" required>
                            <option value="">-- Vyberte prioritu --</option>
                            <option value="low">Nízka</option>
                            <option value="medium" selected>Stredná</option>
                            <option value="high">Vysoká</option>
                            <option value="urgent">Urgentná</option>
                        </select>
                    </div>
                </div>

                <!-- Schvaľovateľ -->
                <div class="form-group">
                    <label class="form-label" for="approver">
                        Schvaľovateľ <span class="required">*</span>
                    </label>
                    <select id="approver" name="approver" class="form-select" required>
                        <option value="">-- Načítavam používateľov... --</option>
                    </select>
                    <p class="helper-text">Vyberte osobu, ktorá má žiadosť schváliť</p>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
                    <span id="btnText">Odoslať žiadosť</span>
                    <span id="btnLoader" class="loading" style="display: none;"></span>
                </button>
            </form>
        </div>
    </div>

    <script src="/assets/js/app.js"></script>
</body>
</html>
