<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETILOG Portal – Sign in</title>
    <link rel="stylesheet" href="/portal/assets/css/portal.css">
    <link rel="stylesheet" href="/portal/assets/css/login.css">
</head>
<body class="auth-body">

    <!-- Značková polovica. Na mobile sa zmenší na pruh nad formulárom: na
         360 pixeloch je miesto na prihlásenie, nie na atmosféru. -->
    <aside class="auth-brand" aria-hidden="true">
        <div class="auth-aurora"><i></i><i></i><i></i></div>
        <div class="auth-brand-inner">
            <img src="/assets/images/logo.png" alt="" class="auth-brand-logo">
            <!-- Nie „packaging & beyond" - to už stojí v logu nad tým. -->
            <p class="auth-brand-claim" data-i18n="loginBrandTitle">Internal portal</p>
            <p class="auth-brand-sub" data-i18n="loginBrandSub">Production, warehouse, fleet and requests in one place.</p>
        </div>
    </aside>

    <main class="auth-panel">
        <!-- Prepínač jazyka hore vpravo, mimo formulára. Kto ho potrebuje,
             hľadá ho v rohu; kto nie, ten ho neprelistuje cestou k heslu. -->
        <div class="auth-lang" role="group" aria-label="Language">
            <button type="button" class="auth-lang-btn" data-lang="en" onclick="authSetLang('en')">EN</button>
            <button type="button" class="auth-lang-btn" data-lang="sk" onclick="authSetLang('sk')">SK</button>
        </div>

        <div class="auth-form">

            <header class="auth-head">
                <img src="/assets/images/logo.png" alt="ETILOG" class="auth-logo-small">
                <h1 data-i18n="loginTitle">Sign in</h1>
                <p id="authLead" data-i18n="loginLeadMs">Continue with your Microsoft work account.</p>
            </header>

            <div id="authError" class="auth-alert" hidden></div>

            <!-- Firemné prihlásenie je prvé: takto sa prihlasuje drvivá
                 väčšina ľudí a nemá pre ňu zmysel čítať formulár nižšie. -->
            <button id="msBtn" class="auth-btn-ms" onclick="signIn()">
                <svg width="18" height="18" viewBox="0 0 21 21" aria-hidden="true">
                    <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
                    <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
                    <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
                    <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
                </svg>
                <span data-i18n="loginMsButton">Sign in with Microsoft</span>
            </button>

            <!-- Heslom sa prihlasujú dodávatelia zvonku. Formulár je vidieť
                 rovno, neschovaný za odkazom - kto ho potrebuje, nemá ho
                 hľadať. -->
            <div id="authPasswordBlock" hidden>
                <div class="auth-or"><span data-i18n="loginOrPassword">or with a password</span></div>

                <form id="authForm" autocomplete="on">
                    <label class="auth-label" for="authEmail" data-i18n="loginEmail">E-mail</label>
                    <input class="auth-input" type="email" id="authEmail" name="email"
                           autocomplete="username" required data-i18n-placeholder="loginEmailHint">

                    <label class="auth-label" for="authPass" data-i18n="loginPassword">Password</label>
                    <div class="auth-pass">
                        <input class="auth-input" type="password" id="authPass" name="password"
                               autocomplete="current-password" required>
                        <button type="button" class="auth-eye" id="authEye"
                                data-i18n-label="loginShowPassword" onclick="authTogglePassword()">👁</button>
                    </div>

                    <button type="submit" class="auth-btn-primary" id="authSubmit"
                            data-i18n="loginSubmit">Sign in</button>
                </form>
            </div>

            <!-- Vynútená zmena hesla po tom, čo ho nastavil administrátor.
                 Ten tak nikdy nepozná heslo, ktorým sa človek reálne
                 prihlasuje. -->
            <div id="authChangeBlock" hidden>
                <div class="auth-or"><span data-i18n="loginChangeTitle">choose your password</span></div>
                <p class="auth-note" data-i18n="loginChangeNote">An administrator set this password for you.</p>
                <form id="authChangeForm">
                    <label class="auth-label" for="authNewPass" data-i18n="loginNewPassword">New password</label>
                    <input class="auth-input" type="password" id="authNewPass"
                           autocomplete="new-password" minlength="10" required>
                    <label class="auth-label" for="authNewPass2" data-i18n="loginNewPasswordAgain">Repeat new password</label>
                    <input class="auth-input" type="password" id="authNewPass2"
                           autocomplete="new-password" minlength="10" required>
                    <button type="submit" class="auth-btn-primary"
                            data-i18n="loginChangeSubmit">Save and continue</button>
                </form>
            </div>

            <div id="authBusy" class="auth-busy" hidden>
                <div class="auth-spinner"></div>
                <p data-i18n="loginBusy">Signing in…</p>
            </div>

            <footer class="auth-foot" data-i18n="loginFooter">ETILOG s.r.o. &bull; Internal use</footer>
        </div>
    </main>

    <script src="/portal/assets/js/portalI18n.js"></script>
    <script src="/portal/assets/js/msal-browser.min.js"></script>
    <script src="/portal/assets/js/authConfig.js"></script>
    <script src="/portal/assets/js/auth.js"></script>
    <script src="/portal/assets/js/loginLocal.js"></script>
</body>
</html>
